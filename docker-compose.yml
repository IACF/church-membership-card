services:
  expo:
    build: .
    ports:
      - '8081:8081'
      - '19000:19000'
      - '19001:19001'
      - '19002:19002'
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-0.0.0.0}
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      # Modo offline: pula a verificação de conta ("unverified app") do Expo Go,
      # que trava o handshake quando o container roda sem TTY interativo (detached).
      - EXPO_OFFLINE=1
    stdin_open: true
    tty: true

volumes:
  node_modules:
